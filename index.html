<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Surge - GD Edition with Accounts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pusab&family=Fredoka+One&family=Righteous&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Fredoka One', 'Righteous', cursive, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a0826 0%, #05020a 100%);
        }

        /* HUD Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 5;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 1.2rem;
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 12px;
            border: 3px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        .health-bar-container {
            width: 200px;
            height: 18px;
            background: #222;
            border-radius: 9px;
            overflow: hidden;
            border: 2px solid #fff;
            margin-top: 5px;
        }
        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #ff5500);
            transition: width 0.2s ease;
        }
        .wave-progress-bar {
            width: 200px;
            height: 10px;
            background: #222;
            border-radius: 5px;
            overflow: hidden;
            border: 2px solid #fff;
            margin-top: 5px;
        }
        .wave-progress-fill {
            width: 0%;
            height: 100%;
            background: #00ff66;
            transition: width 0.1s linear;
        }

        /* User Profile & Orbs Widget */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 20;
        }

        .account-badge {
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #00ffff;
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 1.1rem;
            color: #00ffff;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .orbs-counter {
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ffe600;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 1.3rem;
            color: #ffe600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
        }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 20, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        /* Geometry Dash Style Title */
        .gd-title {
            font-size: 4.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffe600;
            text-shadow: 
                4px 4px 0px #d80000,
                -4px -4px 0px #d80000,
                4px -4px 0px #d80000,
                -4px 4px 0px #d80000,
                0px 8px 0px #800000,
                0px 0px 30px rgba(255, 230, 0, 0.8);
            margin-bottom: 20px;
            transform: skew(-5deg) rotate(-2deg);
            animation: gdPulse 2s infinite alternate ease-in-out;
        }

        @keyframes gdPulse {
            0% { transform: skew(-5deg) rotate(-2deg) scale(1); }
            100% { transform: skew(-5deg) rotate(-2deg) scale(1.05); }
        }

        /* GD Style Main Buttons */
        .gd-main-menu {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-top: 20px;
        }

        .gd-btn-play {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #00ff22, #009900);
            border: 6px solid #fff;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 10px 0px #005500, 0 0 30px rgba(0,255,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s ease;
            position: relative;
        }

        .gd-btn-play::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-left: 45px solid #fff;
            margin-left: 10px;
            filter: drop-shadow(3px 3px 0px #003300);
        }

        .gd-btn-icon {
            width: 95px;
            height: 95px;
            border: 5px solid #fff;
            border-radius: 25px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            transition: all 0.1s ease;
        }

        .gd-btn-shop {
            background: linear-gradient(135deg, #ffe600, #ff8800);
            box-shadow: 0 8px 0px #994400, 0 0 25px rgba(255,200,0,0.6);
        }

        .gd-btn-account {
            background: linear-gradient(135deg, #00ffff, #0088ff);
            box-shadow: 0 8px 0px #004488, 0 0 25px rgba(0,255,255,0.6);
        }

        .gd-btn-play:hover, .gd-btn-icon:hover {
            transform: scale(1.08) translateY(-5px);
        }

        .gd-btn-play:active, .gd-btn-icon:active {
            transform: scale(0.95) translateY(5px);
            box-shadow: 0 2px 0px #000;
        }

        /* Auth Form Box */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 450px;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid #00ffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
        }

        .auth-tabs {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 25px;
        }

        .auth-tab-btn {
            flex: 1;
            padding: 10px;
            font-size: 1.2rem;
            font-family: inherit;
            background: #222;
            border: 2px solid #444;
            border-radius: 10px;
            color: #888;
            cursor: pointer;
            transition: all 0.15s;
        }

        .auth-tab-btn.active {
            background: #00ffff;
            border-color: #fff;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }

        .auth-input-group {
            width: 100%;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .auth-input-group label {
            font-size: 0.9rem;
            color: #ffe600;
            margin-bottom: 5px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid #555;
            background: #111;
            color: #fff;
            font-size: 1rem;
            font-family: sans-serif;
            outline: none;
            transition: border 0.2s;
        }

        .auth-input:focus {
            border-color: #00ffff;
        }

        /* Shop & Customization Tabs */
        .shop-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.88);
            border: 4px solid #ffe600;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 230, 0, 0.3);
            max-height: 85vh;
        }

        .shop-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 10px 25px;
            font-size: 1.1rem;
            font-family: inherit;
            background: #222;
            border: 3px solid #555;
            border-radius: 12px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tab-btn.active {
            background: #ff8800;
            border-color: #ffe600;
            color: #fff;
            box-shadow: 0 0 15px rgba(255,136,0,0.6);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            overflow-y: auto;
            max-height: 50vh;
            padding: 5px;
        }

        .skin-card {
            background: rgba(30, 20, 50, 0.8);
            border: 3px solid #555;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .skin-card.selected {
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
            background: rgba(0, 50, 60, 0.8);
        }

        .skin-preview-box {
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            border: 2px dashed #888;
            position: relative;
        }

        .skin-buy-btn {
            padding: 8px 18px;
            font-size: 1rem;
            font-family: inherit;
            border-radius: 12px;
            border: 2px solid #fff;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            box-shadow: 0 4px 0px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }

        .skin-buy-btn.buy {
            background: #ff9900;
            border-color: #ffe600;
        }

        .skin-buy-btn.equip {
            background: #00cc44;
        }

        .skin-buy-btn.equipped {
            background: #0088ff;
            cursor: default;
        }

        .skin-buy-btn:hover:not(.equipped) {
            transform: scale(1.05);
        }

        .back-btn {
            margin-top: 15px;
            padding: 12px 30px;
            background: #ff3355;
            border: 3px solid #fff;
            border-radius: 15px;
            color: #fff;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 5px 0px #880022;
            transition: transform 0.1s;
        }

        .back-btn:hover {
            transform: scale(1.05);
        }

        /* Upgrades Overlay Cards */
        .cards-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            max-width: 900px;
            width: 90%;
            justify-content: center;
        }

        .card {
            background: rgba(20, 15, 35, 0.9);
            border: 3px solid #00ffff;
            border-radius: 15px;
            padding: 20px;
            width: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .card:hover {
            transform: translateY(-8px) scale(1.04);
            border-color: #ffe600;
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.6);
        }

        .card-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .card-title { font-size: 1.3rem; color: #ffe600; margin-bottom: 8px; }
        .card-desc { font-size: 0.9rem; color: #ccc; line-height: 1.3; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Top Right Account & Currency Widget -->
        <div class="top-right-bar">
            <div class="account-badge">
                👤 <span id="userDisplayName">Guest</span>
            </div>
            <div class="orbs-counter">
                <span>🔮</span>
                <span id="globalOrbsText">0</span>
            </div>
        </div>

        <!-- Gameplay HUD -->
        <div class="ui-layer">
            <div class="hud-top">
                <div class="stat-box">
                    <div>HEALTH</div>
                    <div class="health-bar-container">
                        <div id="healthBar" class="health-bar-fill"></div>
                    </div>
                </div>
                <div class="stat-box" style="text-align: right;">
                    <div>SCORE: <span id="scoreText" style="color: #00ffff;">0</span></div>
                    <div style="font-size: 0.85rem; color: #aaa; margin-top: 3px;">
                        STAGE <span id="waveText">1</span> PROGRESS
                    </div>
                    <div class="wave-progress-bar">
                        <div id="waveProgressBar" class="wave-progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Geometry Dash Main Menu -->
        <div id="mainMenu" class="overlay">
            <h1 class="gd-title">CYBER SURGE</h1>
            <p style="color: #00ffff; text-shadow: 0 0 10px #00ffff; font-size: 1.2rem; margin-bottom: 10px;">GD SHOOTER EDITION</p>
            
            <div class="gd-main-menu">
                <div id="shopBtn" class="gd-btn-icon gd-btn-shop" title="Shop & Accessories">
                    🛒
                    <span style="font-size: 0.75rem; font-family: sans-serif; font-weight: bold; margin-top: 2px;">SHOP</span>
                </div>
                <div id="playBtn" class="gd-btn-play" title="Play Game"></div>
                <div id="authMenuBtn" class="gd-btn-icon gd-btn-account" title="Sign In / Sign Up">
                    👤
                    <span id="accountBtnText" style="font-size: 0.7rem; font-family: sans-serif; font-weight: bold; margin-top: 2px;">ACCOUNT</span>
                </div>
            </div>

            <div style="margin-top: 40px; color: #888; font-size: 0.9rem; text-shadow: 1px 1px 0 #000;">
                [WASD] Move &nbsp;|&nbsp; [Mouse] Aim &nbsp;|&nbsp; [Left Click] Shoot &nbsp;|&nbsp; [ESC] Pause
            </div>
        </div>

        <!-- Auth Overlay (Sign In / Sign Up) -->
        <div id="authScreen" class="overlay hidden">
            <h1 class="gd-title" style="font-size: 2.8rem; margin-bottom: 10px;">USER ACCOUNT</h1>
            <div class="auth-container">
                <div class="auth-tabs">
                    <button id="tabSignIn" class="auth-tab-btn active" onclick="switchAuthTab('signin')">SIGN IN</button>
                    <button id="tabSignUp" class="auth-tab-btn" onclick="switchAuthTab('signup')">SIGN UP</button>
                </div>

                <div class="auth-input-group">
                    <label>USERNAME</label>
                    <input type="text" id="authUsername" class="auth-input" placeholder="Enter username..." />
                </div>

                <div class="auth-input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="authPassword" class="auth-input" placeholder="Enter password..." />
                </div>

                <p id="authErrorText" style="color: #ff0055; font-size: 0.85rem; margin-bottom: 15px; display: none;"></p>

                <button id="authSubmitBtn" class="back-btn" style="background: #00ff22; box-shadow: 0 5px 0 #006600; width: 100%; margin-top: 5px;">LOGIN</button>
                <button id="logoutBtn" class="back-btn" style="background: #ff0055; box-shadow: 0 5px 0 #880022; width: 100%; margin-top: 10px; display: none;">LOG OUT</button>
                <button id="authBackBtn" class="back-btn" style="width: 100%; margin-top: 10px;">BACK</button>
            </div>
        </div>

        <!-- GD Shop / Accessories Menu -->
        <div id="shopScreen" class="overlay hidden">
            <h1 class="gd-title" style="font-size: 3rem; margin-bottom: 5px;">CUSTOMIZE</h1>
            <div class="shop-container">
                <div class="shop-tabs">
                    <button id="tabSkins" class="tab-btn active" onclick="switchShopTab('skins')">Skins</button>
                    <button id="tabAccessories" class="tab-btn" onclick="switchShopTab('accessories')">Accessories</button>
                </div>
                <div id="shopGrid" class="shop-grid"></div>
                <button id="shopBackBtn" class="back-btn">BACK</button>
            </div>
        </div>

        <!-- Pause Menu -->
        <div id="pauseScreen" class="overlay hidden">
            <h1 class="gd-title" style="font-size: 3.5rem; color: #00ffff; text-shadow: 4px 4px 0 #004455; margin-bottom: 15px;">PAUSED</h1>
            <button id="resumeBtn" class="back-btn" style="background: #00ff22; box-shadow: 0 5px 0 #006600; width: 220px;">RESUME</button>
            <button id="pauseMenuBtn" class="back-btn" style="background: #ff3355; box-shadow: 0 5px 0 #880022; width: 220px;">MAIN MENU</button>
        </div>

        <!-- Level Up / Upgrade Selection -->
        <div id="upgradeScreen" class="overlay hidden">
            <h1 class="gd-title" style="font-size: 2.8rem; margin-bottom: 5px;">STAGE CLEARED!</h1>
            <p style="margin-bottom: 15px; color: #00ffff;">Select 1 Upgrade for Stage <span id="nextStageNum">2</span></p>
            <div id="cardsContainer" class="cards-container"></div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1 class="gd-title" style="color: #ff0055; text-shadow: 4px 4px 0 #800020; font-size: 4rem;">DESTROYED!</h1>
            <p style="font-size: 1.5rem; color: #fff; margin-bottom: 10px;">Final Score: <span id="finalScore" style="color: #00ffff;">0</span></p>
            <p style="font-size: 1.2rem; color: #ffe600; margin-bottom: 25px;">Orbs Earned: +<span id="earnedOrbsText">0</span> 🔮</p>
            <button id="restartBtn" class="back-btn" style="background: #00cc44; box-shadow: 0 5px 0 #006622; width: 220px;">TRY AGAIN</button>
            <button id="gameOverMenuBtn" class="back-btn" style="width: 220px;">MAIN MENU</button>
        </div>
    </div>

    <script>
        // Web Audio API Sound System
        const AudioSys = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playShoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            },
            playExplosion() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.18;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.18);
                noise.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            },
            playPowerup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            },
            playUpgrade() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        };

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Input Setup
        const keys = {};
        const mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Escape') {
                if (isRunning && !isPausedForUpgrade) {
                    togglePause();
                }
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', e => { if (e.button === 0) mouse.down = true; });
        window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });

        // Database Items
        const SKINS = [
            { id: 'default', name: 'Classic Ship', cost: 0, color: '#66fcf1', secondary: '#45a29e', shape: 'ship' },
            { id: 'gd_cube', name: 'GD Cube', cost: 100, color: '#00ff22', secondary: '#ffe600', shape: 'cube' },
            { id: 'cyber_dart', name: 'Neon Dart', cost: 250, color: '#ff0055', secondary: '#ff9900', shape: 'dart' },
            { id: 'void_star', name: 'Void Star', cost: 500, color: '#aa00ff', secondary: '#00ffff', shape: 'star' },
            { id: 'golden_v', name: 'Golden Ace', cost: 1000, color: '#ffe600', secondary: '#ffffff', shape: 'ship' }
        ];

        const ACCESSORIES = [
            { id: 'none', name: 'No Accessory', cost: 0, type: 'none' },
            { id: 'crown', name: 'Royal Crown', cost: 150, type: 'crown' },
            { id: 'visor', name: 'Cyber Visor', cost: 300, type: 'visor' },
            { id: 'wings', name: 'Plasma Wings', cost: 600, type: 'wings' },
            { id: 'halo', name: 'Angel Halo', cost: 1200, type: 'halo' }
        ];

        // Accounts & User State Management
        let usersDB = JSON.parse(localStorage.getItem('cybersurge_users')) || {};
        let activeUser = localStorage.getItem('cybersurge_active_user') || null;

        let globalOrbs = 0;
        let unlockedSkins = ['default'];
        let equippedSkinId = 'default';
        let unlockedAccessories = ['none'];
        let equippedAccessoryId = 'none';

        function loadUserData() {
            if (activeUser && usersDB[activeUser]) {
                const data = usersDB[activeUser];
                globalOrbs = data.orbs || 0;
                unlockedSkins = data.skins || ['default'];
                equippedSkinId = data.equippedSkin || 'default';
                unlockedAccessories = data.accessories || ['none'];
                equippedAccessoryId = data.equippedAccessory || 'none';
                document.getElementById('userDisplayName').innerText = activeUser;
                document.getElementById('accountBtnText').innerText = "ACCOUNT";
            } else {
                activeUser = null;
                globalOrbs = 0;
                unlockedSkins = ['default'];
                equippedSkinId = 'default';
                unlockedAccessories = ['none'];
                equippedAccessoryId = 'none';
                document.getElementById('userDisplayName').innerText = "Guest";
                document.getElementById('accountBtnText').innerText = "SIGN IN";
            }
            document.getElementById('globalOrbsText').innerText = globalOrbs;
        }

        function saveUserData() {
            if (activeUser && usersDB[activeUser]) {
                usersDB[activeUser].orbs = globalOrbs;
                usersDB[activeUser].skins = unlockedSkins;
                usersDB[activeUser].equippedSkin = equippedSkinId;
                usersDB[activeUser].accessories = unlockedAccessories;
                usersDB[activeUser].equippedAccessory = equippedAccessoryId;
                
                localStorage.setItem('cybersurge_users', JSON.stringify(usersDB));
                localStorage.setItem('cybersurge_active_user', activeUser);
            }
            document.getElementById('globalOrbsText').innerText = globalOrbs;
        }

        // Auth Logic
        let authTabMode = 'signin';

        window.switchAuthTab = function(mode) {
            authTabMode = mode;
            document.getElementById('tabSignIn').className = `auth-tab-btn ${mode === 'signin' ? 'active' : ''}`;
            document.getElementById('tabSignUp').className = `auth-tab-btn ${mode === 'signup' ? 'active' : ''}`;
            document.getElementById('authSubmitBtn').innerText = mode === 'signin' ? 'LOGIN' : 'REGISTER';
            document.getElementById('authErrorText').style.display = 'none';
        };

        function handleAuthSubmit() {
            const userVal = document.getElementById('authUsername').value.trim();
            const passVal = document.getElementById('authPassword').value.trim();
            const errEl = document.getElementById('authErrorText');

            if (!userVal || !passVal) {
                errEl.innerText = "Please enter both Username and Password.";
                errEl.style.display = 'block';
                return;
            }

            if (authTabMode === 'signup') {
                if (usersDB[userVal]) {
                    errEl.innerText = "Username already exists!";
                    errEl.style.display = 'block';
                    return;
                }
                
                // Properly create user object FIRST
                usersDB[userVal] = {
                    password: passVal,
                    orbs: 0,
                    skins: ['default'],
                    equippedSkin: 'default',
                    accessories: ['none'],
                    equippedAccessory: 'none'
                };
                
                activeUser = userVal;
                saveUserData();
                loadUserData();
                AudioSys.playUpgrade();
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
            } else {
                if (!usersDB[userVal] || usersDB[userVal].password !== passVal) {
                    errEl.innerText = "Invalid Username or Password!";
                    errEl.style.display = 'block';
                    return;
                }
                activeUser = userVal;
                loadUserData();
                AudioSys.playPowerup();
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
            }
        }

        function handleLogout() {
            activeUser = null;
            localStorage.removeItem('cybersurge_active_user');
            loadUserData();
            AudioSys.playExplosion();
            renderAuthScreenUI();
        }

        function renderAuthScreenUI() {
            if (activeUser) {
                document.getElementById('authUsername').value = activeUser;
                document.getElementById('authUsername').disabled = true;
                document.getElementById('authPassword').value = "********";
                document.getElementById('authPassword').disabled = true;
                document.getElementById('authSubmitBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
            } else {
                document.getElementById('authUsername').value = "";
                document.getElementById('authUsername').disabled = false;
                document.getElementById('authPassword').value = "";
                document.getElementById('authPassword').disabled = false;
                document.getElementById('authSubmitBtn').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'none';
            }
            document.getElementById('authErrorText').style.display = 'none';
        }

        // Upgrades Pool
        const UPGRADE_POOL = [
            { id: 'multishot', icon: '💥', title: '+1 Barrel', desc: 'Fires an extra bullet spread with every shot.', apply: (p) => p.shotCount += 1 },
            { id: 'firerate', icon: '⚡', title: 'Rapid Fire', desc: 'Increases attack speed by 25%.', apply: (p) => p.fireRate = Math.max(50, p.fireRate * 0.75) },
            { id: 'movespeed', icon: '👟', title: 'Overclock', desc: 'Increases movement speed by 20%.', apply: (p) => p.speed += 1.2 },
            { id: 'heal', icon: '❤️', title: 'Repair Core', desc: 'Restores 50 Health & increases Max Health by 25.', apply: (p) => { p.maxHealth += 25; p.health = Math.min(p.maxHealth, p.health + 50); } },
            { id: 'bulletsize', icon: '💣', title: 'Heavy Rounds', desc: 'Increases bullet damage and size substantially.', apply: (p) => { p.bulletDamage += 1; p.bulletRadius += 2; } },
            { id: 'piercing', icon: '🎯', title: 'Penetration', desc: 'Bullets pierce through +1 additional enemy.', apply: (p) => p.bulletPiercing += 1 }
        ];

        // Game State Variables
        let isRunning = false;
        let isPaused = false;
        let isPausedForUpgrade = false;
        let score = 0;
        let wave = 1;
        let sessionOrbs = 0;
        let lastShootTime = 0;
        let stageKills = 0;
        let stageKillsTarget = 15;

        let player;
        let projectiles = [];
        let enemies = [];
        let particles = [];
        let powerups = [];

        // Player Class
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 18;
                this.speed = 5;
                this.maxHealth = 100;
                this.health = 100;
                this.angle = 0;
                this.fireRate = 180;
                this.shotCount = 1;
                this.bulletDamage = 1;
                this.bulletRadius = 4;
                this.bulletPiercing = 0;
            }

            update() {
                let dx = 0, dy = 0;
                if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }

                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x + dx * this.speed));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y + dy * this.speed));
                this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
            }

            draw() {
                const skin = SKINS.find(s => s.id === equippedSkinId) || SKINS[0];

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.shadowBlur = 15;
                ctx.shadowColor = skin.color;

                // Skin Shape Rendering
                if (skin.shape === 'cube') {
                    ctx.fillStyle = skin.color;
                    ctx.fillRect(-16, -16, 32, 32);
                    ctx.strokeStyle = skin.secondary;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(-16, -16, 32, 32);
                    ctx.fillStyle = skin.secondary;
                    ctx.fillRect(2, -6, 10, 12);
                } else if (skin.shape === 'dart') {
                    ctx.fillStyle = skin.color;
                    ctx.beginPath();
                    ctx.moveTo(22, 0);
                    ctx.lineTo(-14, -14);
                    ctx.lineTo(-6, 0);
                    ctx.lineTo(-14, 14);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = skin.secondary;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (skin.shape === 'star') {
                    ctx.fillStyle = skin.color;
                    ctx.beginPath();
                    for(let i=0; i<4; i++) {
                        ctx.rotate(Math.PI/2);
                        ctx.lineTo(18, 0);
                        ctx.lineTo(6, 6);
                    }
                    ctx.fill();
                } else {
                    ctx.fillStyle = skin.color;
                    ctx.beginPath();
                    ctx.moveTo(20, 0);
                    ctx.lineTo(-12, -14);
                    ctx.lineTo(-6, 0);
                    ctx.lineTo(-12, 14);
                    ctx.closePath();
                    ctx.fill();
                }

                // Accessory Rendering
                if (equippedAccessoryId === 'crown') {
                    ctx.fillStyle = '#ffe600';
                    ctx.beginPath();
                    ctx.moveTo(-6, -12);
                    ctx.lineTo(-10, -22);
                    ctx.lineTo(-2, -16);
                    ctx.lineTo(2, -22);
                    ctx.lineTo(6, -16);
                    ctx.lineTo(10, -22);
                    ctx.lineTo(6, -12);
                    ctx.closePath();
                    ctx.fill();
                } else if (equippedAccessoryId === 'visor') {
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(4, -8, 8, 16);
                } else if (equippedAccessoryId === 'wings') {
                    ctx.fillStyle = '#ff0055';
                    ctx.beginPath();
                    ctx.moveTo(-10, -10);
                    ctx.lineTo(-22, -24);
                    ctx.lineTo(-14, -4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(-10, 10);
                    ctx.lineTo(-22, 24);
                    ctx.lineTo(-14, 4);
                    ctx.closePath();
                    ctx.fill();
                } else if (equippedAccessoryId === 'halo') {
                    ctx.strokeStyle = '#ffe600';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(-2, 0, 14, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, angle, damage, radius, piercing) {
                this.x = x;
                this.y = y;
                this.speed = 14;
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.radius = radius;
                this.damage = damage;
                this.piercing = piercing;
                this.hitEnemies = new Set();
                this.markedForDeletion = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00ffff';
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.markedForDeletion = false;

                if (type === 'fast') {
                    this.radius = 12;
                    this.speed = 3.6;
                    this.hp = 1 + Math.floor(wave * 0.3);
                    this.color = '#ffe600';
                    this.scoreValue = 150;
                    this.orbsValue = 3;
                } else if (type === 'tank') {
                    this.radius = 28;
                    this.speed = 1.2;
                    this.hp = 6 + wave * 2;
                    this.color = '#ff0055';
                    this.scoreValue = 300;
                    this.orbsValue = 8;
                } else {
                    this.radius = 16;
                    this.speed = 2.2;
                    this.hp = 2 + Math.floor(wave * 0.5);
                    this.color = '#ff5500';
                    this.scoreValue = 100;
                    this.orbsValue = 2;
                }
            }

            update() {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
                this.markedForDeletion = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                if (this.alpha <= 0) this.markedForDeletion = true;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Powerup {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 12;
                this.markedForDeletion = false;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00ff66';
                ctx.fillStyle = '#00ff66';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('+', this.x, this.y);
                ctx.restore();
            }
        }

        // Core Functions
        function spawnEnemy() {
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -30 : canvas.width + 30;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -30 : canvas.height + 30;
            }

            const rand = Math.random();
            let type = 'chaser';
            if (rand < 0.2) type = 'tank';
            else if (rand < 0.5) type = 'fast';

            enemies.push(new Enemy(x, y, type));
        }

        function createExplosion(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
        }

        function shoot() {
            const now = Date.now();
            if (now - lastShootTime >= player.fireRate) {
                const totalSpread = 0.15 * (player.shotCount - 1);
                const startAngle = player.angle - totalSpread / 2;

                for (let i = 0; i < player.shotCount; i++) {
                    const angle = player.shotCount === 1 ? player.angle : startAngle + i * (totalSpread / (player.shotCount - 1));
                    projectiles.push(new Projectile(player.x, player.y, angle, player.bulletDamage, player.bulletRadius, player.bulletPiercing));
                }

                AudioSys.playShoot();
                lastShootTime = now;
            }
        }

        function updateHUD() {
            document.getElementById('scoreText').innerText = score;
            document.getElementById('waveText').innerText = wave;
            const healthPercent = Math.max(0, (player.health / player.maxHealth) * 100);
            document.getElementById('healthBar').style.width = healthPercent + '%';

            const progressPercent = Math.min(100, (stageKills / stageKillsTarget) * 100);
            document.getElementById('waveProgressBar').style.width = progressPercent + '%';
        }

        function triggerStageClear() {
            isPausedForUpgrade = true;
            enemies = [];
            projectiles = [];
            powerups = [];
            
            document.getElementById('nextStageNum').innerText = wave + 1;
            const cardsContainer = document.getElementById('cardsContainer');
            cardsContainer.innerHTML = '';

            const shuffled = [...UPGRADE_POOL].sort(() => 0.5 - Math.random());
            const options = shuffled.slice(0, 3);

            options.forEach(upg => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-icon">${upg.icon}</div>
                    <div class="card-title">${upg.title}</div>
                    <div class="card-desc">${upg.desc}</div>
                `;
                card.addEventListener('click', () => {
                    upg.apply(player);
                    AudioSys.playUpgrade();
                    wave++;
                    stageKills = 0;
                    stageKillsTarget = Math.floor(15 + wave * 8);
                    isPausedForUpgrade = false;
                    document.getElementById('upgradeScreen').classList.add('hidden');
                    updateHUD();
                    requestAnimationFrame(gameLoop);
                });
                cardsContainer.appendChild(card);
            });

            document.getElementById('upgradeScreen').classList.remove('hidden');
        }

        function resetGame() {
            player = new Player(canvas.width / 2, canvas.height / 2);
            projectiles = [];
            enemies = [];
            particles = [];
            powerups = [];
            score = 0;
            wave = 1;
            sessionOrbs = 0;
            stageKills = 0;
            stageKillsTarget = 15;
            isPaused = false;
            isPausedForUpgrade = false;
            updateHUD();
        }

        function togglePause() {
            isPaused = !isPaused;
            const pauseScreen = document.getElementById('pauseScreen');
            if (isPaused) {
                pauseScreen.classList.remove('hidden');
            } else {
                pauseScreen.classList.add('hidden');
                requestAnimationFrame(gameLoop);
            }
        }

        function gameOver() {
            isRunning = false;
            globalOrbs += sessionOrbs;
            saveUserData();

            document.getElementById('finalScore').innerText = score;
            document.getElementById('earnedOrbsText').innerText = sessionOrbs;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function returnToMenu() {
            isRunning = false;
            isPaused = false;
            isPausedForUpgrade = false;
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
            saveUserData();
        }

        // Shop UI Rendering
        let currentShopTab = 'skins';

        window.switchShopTab = function(tab) {
            currentShopTab = tab;
            document.getElementById('tabSkins').className = `tab-btn ${tab === 'skins' ? 'active' : ''}`;
            document.getElementById('tabAccessories').className = `tab-btn ${tab === 'accessories' ? 'active' : ''}`;
            renderShop();
        };

        function renderShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';

            if (currentShopTab === 'skins') {
                SKINS.forEach(skin => {
                    const isUnlocked = unlockedSkins.includes(skin.id);
                    const isEquipped = equippedSkinId === skin.id;

                    const card = document.createElement('div');
                    card.className = `skin-card ${isEquipped ? 'selected' : ''}`;

                    let buttonHTML = '';
                    if (isEquipped) {
                        buttonHTML = `<button class="skin-buy-btn equipped">EQUIPPED</button>`;
                    } else if (isUnlocked) {
                        buttonHTML = `<button class="skin-buy-btn equip" onclick="equipSkin('${skin.id}')">EQUIP</button>`;
                    } else {
                        buttonHTML = `<button class="skin-buy-btn buy" onclick="buySkin('${skin.id}', ${skin.cost})">🔮 ${skin.cost}</button>`;
                    }

                    card.innerHTML = `
                        <div class="skin-preview-box">
                            <div style="width: 30px; height: 30px; background: ${skin.color}; border: 2px solid ${skin.secondary}; border-radius: ${skin.shape === 'cube' ? '4px' : '50%'};"></div>
                        </div>
                        <div style="font-weight: bold; font-size: 1.1rem; color: #fff;">${skin.name}</div>
                        ${buttonHTML}
                    `;
                    grid.appendChild(card);
                });
            } else {
                ACCESSORIES.forEach(acc => {
                    const isUnlocked = unlockedAccessories.includes(acc.id);
                    const isEquipped = equippedAccessoryId === acc.id;

                    const card = document.createElement('div');
                    card.className = `skin-card ${isEquipped ? 'selected' : ''}`;

                    let buttonHTML = '';
                    if (isEquipped) {
                        buttonHTML = `<button class="skin-buy-btn equipped">EQUIPPED</button>`;
                    } else if (isUnlocked) {
                        buttonHTML = `<button class="skin-buy-btn equip" onclick="equipAccessory('${acc.id}')">EQUIP</button>`;
                    } else {
                        buttonHTML = `<button class="skin-buy-btn buy" onclick="buyAccessory('${acc.id}', ${acc.cost})">🔮 ${acc.cost}</button>`;
                    }

                    let accIcon = '👑';
                    if (acc.type === 'visor') accIcon = '👓';
                    if (acc.type === 'wings') accIcon = '🦅';
                    if (acc.type === 'halo') accIcon = '😇';
                    if (acc.type === 'none') accIcon = '🚫';

                    card.innerHTML = `
                        <div class="skin-preview-box" style="font-size: 1.8rem;">
                            ${accIcon}
                        </div>
                        <div style="font-weight: bold; font-size: 1.1rem; color: #fff;">${acc.name}</div>
                        ${buttonHTML}
                    `;
                    grid.appendChild(card);
                });
            }
        }

        window.buySkin = function(skinId, cost) {
            if (globalOrbs >= cost) {
                globalOrbs -= cost;
                unlockedSkins.push(skinId);
                equippedSkinId = skinId;
                saveUserData();
                AudioSys.playUpgrade();
                renderShop();
            } else {
                alert("Not enough Orbs! Clear stages to earn more.");
            }
        };

        window.equipSkin = function(skinId) {
            equippedSkinId = skinId;
            saveUserData();
            AudioSys.playPowerup();
            renderShop();
        };

        window.buyAccessory = function(accId, cost) {
            if (globalOrbs >= cost) {
                globalOrbs -= cost;
                unlockedAccessories.push(accId);
                equippedAccessoryId = accId;
                saveUserData();
                AudioSys.playUpgrade();
                renderShop();
            } else {
                alert("Not enough Orbs! Clear stages to earn more.");
            }
        };

        window.equipAccessory = function(accId) {
            equippedAccessoryId = accId;
            saveUserData();
            AudioSys.playPowerup();
            renderShop();
        };

        // Main Game Loop
        function gameLoop() {
            if (!isRunning || isPaused || isPausedForUpgrade) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (enemies.length < Math.min(25, 5 + wave * 3)) {
                if (Math.random() < 0.05) spawnEnemy();
            }

            if (mouse.down) shoot();

            player.update();
            player.draw();

            projectiles.forEach(p => { p.update(); p.draw(); });

            powerups.forEach(pow => {
                pow.draw();
                const dist = Math.hypot(player.x - pow.x, player.y - pow.y);
                if (dist < player.radius + pow.radius) {
                    AudioSys.playPowerup();
                    player.health = Math.min(player.maxHealth, player.health + 25);
                    pow.markedForDeletion = true;
                    updateHUD();
                }
            });

            enemies.forEach(e => {
                e.update();
                e.draw();

                const dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist < player.radius + e.radius) {
                    player.health -= 15;
                    e.markedForDeletion = true;
                    createExplosion(e.x, e.y, e.color);
                    AudioSys.playExplosion();
                    updateHUD();

                    if (player.health <= 0) gameOver();
                }
            });

            projectiles.forEach(p => {
                enemies.forEach(e => {
                    if (p.hitEnemies.has(e)) return;

                    const dist = Math.hypot(p.x - e.x, p.y - e.y);
                    if (dist < p.radius + e.radius) {
                        p.hitEnemies.add(e);
                        e.hp -= p.damage;
                        createExplosion(p.x, p.y, '#fff', 4);

                        if (p.hitEnemies.size > p.piercing) p.markedForDeletion = true;

                        if (e.hp <= 0) {
                            e.markedForDeletion = true;
                            createExplosion(e.x, e.y, e.color, 12);
                            AudioSys.playExplosion();
                            score += e.scoreValue;
                            sessionOrbs += e.orbsValue;
                            stageKills++;

                            if (Math.random() < 0.15) powerups.push(new Powerup(e.x, e.y));

                            updateHUD();

                            if (stageKills >= stageKillsTarget) triggerStageClear();
                        }
                    }
                });
            });

            particles.forEach(pt => { pt.update(); pt.draw(); });

            projectiles = projectiles.filter(p => !p.markedForDeletion);
            enemies = enemies.filter(e => !e.markedForDeletion);
            particles = particles.filter(pt => !pt.markedForDeletion);
            powerups = powerups.filter(pow => !pow.markedForDeletion);

            requestAnimationFrame(gameLoop);
        }

        // UI Event Listeners
        document.getElementById('playBtn').addEventListener('click', () => {
            AudioSys.init();
            document.getElementById('mainMenu').classList.add('hidden');
            resetGame();
            isRunning = true;
            requestAnimationFrame(gameLoop);
        });

        document.getElementById('shopBtn').addEventListener('click', () => {
            AudioSys.init();
            currentShopTab = 'skins';
            document.getElementById('tabSkins').className = 'tab-btn active';
            document.getElementById('tabAccessories').className = 'tab-btn';
            renderShop();
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('shopScreen').classList.remove('hidden');
        });

        document.getElementById('shopBackBtn').addEventListener('click', () => {
            document.getElementById('shopScreen').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        });

        document.getElementById('authMenuBtn').addEventListener('click', () => {
            AudioSys.init();
            renderAuthScreenUI();
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        });

        document.getElementById('authSubmitBtn').addEventListener('click', () => {
            handleAuthSubmit();
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            handleLogout();
        });

        document.getElementById('authBackBtn').addEventListener('click', () => {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
        });

        document.getElementById('resumeBtn').addEventListener('click', () => {
            togglePause();
        });

        document.getElementById('pauseMenuBtn').addEventListener('click', () => {
            returnToMenu();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOverScreen').classList.add('hidden');
            resetGame();
            isRunning = true;
            requestAnimationFrame(gameLoop);
        });

        document.getElementById('gameOverMenuBtn').addEventListener('click', () => {
            returnToMenu();
        });

        // Initialize User Data
        loadUserData();
    </script>
</body>
</html>
